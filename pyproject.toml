[project]
name = "simple-langchain-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchainhub>=0.1.21",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
